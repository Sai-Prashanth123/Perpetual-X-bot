# Perpetual X — the X account connector on Render's free plan.
# The agency runs in Slack (the Hermes bot on its own server, deploy/docker-compose.bot.yml) with
# an external Postgres (e.g. Neon). This service only hosts the "Connect X" OAuth page that
# Perpetual links to. Free web services sleep when idle and wake on the next request.
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied.

services:
  - type: web
    name: agency-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL           # the same Postgres the bot uses
        sync: false
      - key: PUBLIC_URL             # this service's https URL; X redirects back to /x/callback
        sync: false
      - key: INTERNAL_TOKEN         # must match the bot's: it signs the Connect X links
        sync: false
      - key: TOKEN_ENCRYPTION_KEY   # must match the bot's: X tokens are encrypted with it
        sync: false
      - key: SLACK_BOT_TOKEN        # to refresh cards' "Post now" buttons after connecting
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
