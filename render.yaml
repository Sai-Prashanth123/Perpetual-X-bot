# Perpetual X — the dashboard on Render's free plan.
# The Hermes bot runs on its own server (deploy/docker-compose.bot.yml) and the database is
# external (e.g. Neon), so this Blueprint has just the web service. Free web services sleep
# after 15 minutes idle and wake on the next request (~30-60 s).
# Secrets are `sync: false`: Render asks for them when the Blueprint is first applied.

services:
  - type: web
    name: agency-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL           # the same Postgres the bot uses
        sync: false
      - key: PUBLIC_URL             # https://agency-web.onrender.com (or your domain)
        sync: false
      - key: INTERNAL_TOKEN         # must match the bot's INTERNAL_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY   # Fernet key; see README for the one-liner that makes one
        sync: false
      - key: XCONSOLE_API_KEY
        sync: false
      - key: XCONSOLE_URL
        value: https://scraping.thought-pilot.co/api
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: OWNER_SLACK_IDS
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
