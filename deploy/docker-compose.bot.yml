# Single-server deployment (Oracle Cloud Always Free): the Hermes bot, the connector web app
# (sign-in pages for X, Google, Notion, Read AI) and Caddy for automatic HTTPS. The database is
# external (Neon): DATABASE_URL in deploy/.env. DOMAIN defaults to <ip-with-dashes>.sslip.io.
#
#   docker compose -f deploy/docker-compose.bot.yml --env-file deploy/.env up -d --build
#
# Oracle: open TCP 80 and 443 in the instance's VCN security list (ingress from 0.0.0.0/0).

name: perpetual-x-bot

services:
  bot:
    build: {context: .., dockerfile: Dockerfile}
    restart: unless-stopped
    env_file: .env
    volumes:
      - botdata:/opt/data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  web:
    build: {context: .., dockerfile: web/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
      # one small worker: this box has 1 GB
      WEB_CONCURRENCY: "1"
    mem_limit: 160m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    mem_limit: 64m
    depends_on: [web]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  botdata:
  caddy_data:
